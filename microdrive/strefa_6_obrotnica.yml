# STREFA 6: obrotnica
connectors:
  B_SLEW1:
    type: Dwa czujniki indukcyjne licznika obrotow obrotnicy - ifm IGM
    pins:
    - 1
    - 3
    - 4
    pinlabels:
    - L+ (10..36 V)
    - L-
    - wyjscie PNP czujnika A
    subtype: ifm electronic IGM200
    notes: 'FIX32: PNP 3-przewodowy, NO (znacznik = +24 V na wyjsciu). Wejscia timerowe
      P115/P116 jako

      DI z pull-down 10 kOhm (SM 4.11.5.1, 0..32 V); SLEW_SENSOR_ACTIVE_LOW = FALSE.
      Zasilanie

      zwykle zabezpieczone +24 V (czujnik nie-safety; nie musi byc z wyjscia TTC).
      P125/P126

      zwolnione. Kolory zyl wg standardu M12 (BN/BU/BK) - potwierdzic z kablem. Geometria

      znacznikow: SLEW_SEQUENCE_CONFIRMED.'
  B_SLEW2:
    type: Dwa czujniki indukcyjne licznika obrotow obrotnicy - ifm IGM
