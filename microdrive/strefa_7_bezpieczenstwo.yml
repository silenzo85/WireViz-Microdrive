connectors:
  SB1:
    type: E-STOP 2-kanalowy stanowiska operatora (przez zlacze obrotow
    pins:
    - 11/12
    - 13/14
    - 21/22
    - 23/24
    - 11/13/21/23
    pinlabels:
    - NC1 - grupa A wejscie 0 (zwoln
    - NO1 - grupa A wejscie 1 (zwoln
    - NC2 - grupa B wejscie 0 (zwoln
    - NO2 - grupa B wejscie 1 (zwoln
    - wspolne +24 V styków
    subtype: APEM/IDEC XW 2NO-2NC (wg BOM, niepotwierdzony)
    notes: 'Para NC+NO na grupe odciecia (IO Driver Manual 7.16.4: wejscie 0 HIGH,
      wejscie 1 LOW =

      praca). Numeracja styków = konwencja IEC (niepotwierdzona karta). Przez pierscien
      4 tory,

      NIE szeregowo. Zrodlo +24 V petli: TODO_HARDWARE.'
  SB2_SB3:
    type: Zewnetrzne E-STOP strefowe (pigtail 4 x AWG22, 500 mm, IP67)
    pins:
    - biegun 1 C
    - biegun 1 NC
    - biegun 2 C
    - biegun 2 NC
    pinlabels:
    - styk
    - styk
    - styk
    - styk
    subtype: APEM ES1C41653 (seria ES, 2NC - dekodowanie niepotwierdzone)
    notes: 'Program: Estop1 -&gt; P101, Estop2 -&gt; P102 (alternatywne DI pinow HS
      PWM: staly pull-up ~4,5

      V, tylko styk do masy). FIX30: styk NC do masy, pressed = pin (wcisniety / przerwa
      = HIGH

      = STOP).'
  HOLD1_2_silownik_hamulca:
    type: Urzadzenia jeszcze nie dobrane
    pins:
    - ?1
    - ?2
    - ?3
    - ?4
    - ?5
    pinlabels:
    - deadman kanal 1
    - deadman kanal 2
    - silownik hamulca - cewka WYSUW
    - silownik hamulca - cewka WSUW
    - potencjometr silownika (zasila
    subtype: '-'
    notes: Pinout po doborze. Piny TTC wg programu ponizej.
