    - 'NO1 - grupa A wejscie 1 '
    - 'NC2 - grupa B wejscie 0 '
    - 'NO2 - grupa B wejscie 1 '
    notes: Kolory zyl wg KONWENCJI FUNKCYJNEJ (karta ich nie podaje) - do zatwierdzenia
      przed zamowieniem wiazki. Dlugosc DO USTALENIA.
  W_SB2_SB3:
    type: wiazka SB2_SB3
    wirecount: 2
    colors:
    - BN
    - WH
    wirelabels:
    - styk
    - styk
    notes: Kolory zyl wg karty urzadzenia. Dlugosc DO USTALENIA.
  W_HOLD1_2_HA1_HA2_silownik_hamulca_kamery:
