# Wiazka czujnikow cisnienia BP1...BP6 -> HY-TTC 510
#
# Dane zrodlowe (NIE zmyslone - z dokumentow projektu):
#   - alokacja pinow: driver/KONTEKST_PROJEKTU.md §4
#       BP1 P108 (IO_ADC_10) · BP2 P132 (IO_ADC_11) · BP3 P109 (IO_ADC_12)
#       BP4 P133 (IO_ADC_13) · BP5 P110 (IO_ADC_14) · BP6 P134 (IO_ADC_15)
#       zasilanie petli 4...20 mA: P149 (IO_DO_00, HS DO, PRZELACZANE)
#   - czujnik: dokumenty/hydac/hpt 144S-A-0600-000.pdf
#       HYDAC HPT 144S-A-0600-000, mat. 929389, 0...600 bar,
#       4...20 mA DWUPRZEWODOWE, Deutsch DT04-2P, pin 1 = Signal+, pin 2 = Signal-
#   - uzasadnienie zasilania z P149 zamiast SUP_5V: KONTEKST §5b
#
# ZALOZENIA DO POTWIERDZENIA (oznaczone tez w notatkach na rysunku):
#   - typ i przekroj przewodu 2 x 0,75 mm2 oraz ekranowanie - nieustalone w dokumentach
#   - dlugosci odcinkow - do zdjecia z maszyny

metadata:
  title: Czujniki cisnienia BP1-BP6
  pn: MD-WH-001
  revision: A
  date: 2026-09-18

connectors:
  X1:
    type: HY-TTC 510
    subtype: petla pradowa 4...20 mA
    notes: Wejscia 2-Mode 10 V w trybie pradowym 0...25 mA - bez bocznikow zewnetrznych
    pins:      [P149,                 P108,        P132,        P109,         P133,         P110,         P134]
    pinlabels: ['+24V petla 4-20mA',  'BP1 petla A','BP2 petla B','BP3 lapa C1','BP4 lapa C2','BP5 lapa C3','BP6 lapa C4']

  XT1:
    type: Listwa rozdzielcza
    subtype: rozgalezienie zasilania petli
    pincount: 7
    pinlabels: ['we +24V', 'BP1', 'BP2', 'BP3', 'BP4', 'BP5', 'BP6']

  BP1: &hpt
    type: HYDAC HPT 144S-A-0600-000
    subtype: 0...600 bar, 4...20 mA 2-przew.
    pn: '929389'
    manufacturer: HYDAC
    pincount: 2
    pinlabels: ['Signal+', 'Signal-']
    notes: Deutsch DT04-2P, G1/4 A ISO 1179-2, 20 Nm, IP67
  BP2: *hpt
  BP3: *hpt
  BP4: *hpt
  BP5: *hpt
  BP6: *hpt

cables:
  WZ:
    type: Zasilanie petli
    gauge: 1 mm2
    colors: [RD]
    length: 1.5

  W1: &wbp
    type: LiYCY 2 x 0,75
    gauge: 0.75 mm2
    colors: [RD, BK]
    wirelabels: ['+24V', 'sygnal']
    length: 2
  W2: *wbp
  W3: *wbp
  W4: *wbp
  W5: *wbp
  W6: *wbp

connections:
  # zasilanie petli: P149 -> listwa rozdzielcza
  -
    - X1: [P149]
    - WZ: [1]
    - XT1: [1]

  # BP1
  -
    - XT1: [2]
    - W1: [1]
    - BP1: [1]
  -
    - BP1: [2]
    - W1: [2]
    - X1: [P108]

  # BP2
  -
    - XT1: [3]
    - W2: [1]
    - BP2: [1]
  -
    - BP2: [2]
    - W2: [2]
    - X1: [P132]

  # BP3
  -
    - XT1: [4]
    - W3: [1]
    - BP3: [1]
  -
    - BP3: [2]
    - W3: [2]
    - X1: [P109]

  # BP4
  -
    - XT1: [5]
    - W4: [1]
    - BP4: [1]
  -
    - BP4: [2]
    - W4: [2]
    - X1: [P133]

  # BP5
  -
    - XT1: [6]
    - W5: [1]
    - BP5: [1]
  -
    - BP5: [2]
    - W5: [2]
    - X1: [P110]

  # BP6
  -
    - XT1: [7]
    - W6: [1]
    - BP6: [1]
  -
    - BP6: [2]
    - W6: [2]
    - X1: [P134]
