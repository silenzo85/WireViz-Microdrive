    type: Pedal jazdy MCS 962 845 M028, CAN J1939 (SA 0x82, EEC2 0x0CF
    pins:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    pinlabels:
    - CAN HIGH
    - CAN SHIELD
    - 0 V GROUND
    - CAN LOW
    - '-'
