    subtype: Mobile Control Systems
    notes: 'Wezel magistrali CAN0. Zasilanie wezlow CAN0 z P155. Ramka EEC2: b0 bity
      0..1 IVS, b1 APP1, b6 licznik, b7 CRC8 (z ID + b0..b6); brak ramek przez 2 s
      po wlaczeniu.'
